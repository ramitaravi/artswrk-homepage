<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Defaults for every route. server/seoMeta.ts swaps these per landing page
         before the HTML is served, because crawlers don't run the SPA's JS. -->
    <title>Artswrk | Hire Artists, Find WRK</title>
    <meta name="description" content="Jobs for dance teachers, competition staff, musicians, photographers and more. Post a job free, or find work that pays what you're worth." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Artswrk" />
    <meta property="og:url" content="https://artswrk.com/" />
    <meta property="og:title" content="Artswrk | Hire Artists, Find WRK" />
    <meta property="og:description" content="Jobs for dance teachers, competition staff, musicians, photographers and more. Post a job free, or find work that pays what you're worth." />
    <meta property="og:image" content="https://artswrk.com/og/home.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Artswrk — Hire Artists. Find WRK." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Artswrk | Hire Artists, Find WRK" />
    <meta name="twitter:description" content="Jobs for dance teachers, competition staff, musicians, photographers and more. Post a job free, or find work that pays what you're worth." />
    <meta name="twitter:image" content="https://artswrk.com/og/home.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
